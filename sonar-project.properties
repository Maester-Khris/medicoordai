# Duplication (copy-paste detection) exclusions.
# caseStudies.ts is a content/data file: each entry shares the same
# TypeScript interface shape ({ title, desc, icon }, { text, bold }, etc.),
# so structural repetition across entries is inherent to the data, not
# duplicated logic. Flagging it as "duplication" is a false positive.
sonar.cpd.exclusions=webapp/src/data/caseStudies.ts

# Offline tooling: eval, embedding, security-probe and ingest scripts. They take file paths and URLs from the
# command line on purpose and are run by hand by the owner, never exposed to a request, so the taint rules
# (path traversal, SSRF) on their arguments are noise. The API and the web app stay analysed.
sonar.exclusions=backend/scripts/**
