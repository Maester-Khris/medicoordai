AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Medicoord pipeline — Lambda ingestion + processing functions.
  Depends on medicoord-ingestion-bucket stack for S3 bucket name/ARN.

# ── GLOBALS ────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 256
    Environment:
      Variables:
        S3_BUCKET: !ImportValue medicoord-ingestion-bucket-name
        SUPABASE_URL: '{{resolve:ssm:/medicoord/prod/supabase_url}}'
        SUPABASE_KEY: '{{resolve:ssm:/medicoord/prod/supabase_key}}'
        SUPABASE_HOST:        '{{resolve:ssm:/medicoord/prod/supabase_host}}'
        SUPABASE_DB_USER:     '{{resolve:ssm:/medicoord/prod/supabase_db_user}}'
        SUPABASE_DB_PASSWORD: '{{resolve:ssm:/medicoord/prod/supabase_db_password}}'
        AWS_REGION_NAME: us-east-1

# ── RESOURCES ──────────────────────────────────────────────────────────────
Resources:

  # ── LAYERS ───────────────────────────────────────────────────────────────

  RequestsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: medicoord-requests-layer
      ContentUri: ../layer_pkg/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # ── NEW: dbt layer ───────────────────────────────────────────────────────
  # dbt-core + dbt-postgres + psycopg2 packaged under python/ prefix.
  # Built separately from requests layer — different dependency set,
  # heavier (~40MB), only needed by dbt-runner not by ingestion functions.
  # Build command:
  #   pip install dbt-core dbt-postgres psycopg2-binary \
  #     -t dbt_layer_pkg/python \
  #     --platform manylinux2014_x86_64 \
  #     --implementation cp --python-version 3.12 --only-binary=:all:
  DbtLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: medicoord-dbt-layer
      ContentUri: ../dbt_layer_pkg/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # ── IAM ROLE: INGESTION ──────────────────────────────────────────────────
  # Permissions: SSM read + S3 write + CloudWatch logs + EventBridge publish
  # Added EventBridge PutEvents so processors can signal completion.
  # NOTE: PutEvents added here too since ingestion role is parent template —
  # actual PutEvents usage is in ProcessorRole below.
  IngestionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: medicoord-ingestion-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SSMRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/medicoord/prod/*'

        - PolicyName: S3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - '${BucketArn}/*'
                  - BucketArn: !ImportValue medicoord-ingestion-bucket-arn

        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:*'

  # ── IAM ROLE: PROCESSOR ──────────────────────────────────────────────────
  # NEW: added EventBridge PutEvents so each processor can publish
  # a ProcessorComplete event after successful Supabase upsert.
  # This is what triggers the dbt runner downstream.
  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: medicoord-processor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - '${BucketArn}/*'
                  - BucketArn: !ImportValue medicoord-ingestion-bucket-arn

        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:*'

        # ── NEW ──────────────────────────────────────────────────────────
        # Allows processors to publish completion events to EventBridge
        # default bus. Source will be 'medicoord.pipeline'.
        - PolicyName: EventBridgePublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:aws:events:us-east-1:${AWS::AccountId}:event-bus/default'

  # ── NEW: IAM ROLE: DBT RUNNER ─────────────────────────────────────────────
  # Permissions: CloudWatch logs only.
  # Supabase accessed via HTTPS using SUPABASE_URL + SUPABASE_KEY env vars.
  # No S3 access needed — dbt connects directly to Supabase Postgres.
  # No SSM access needed — credentials injected via Globals env vars.
  DbtRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: medicoord-dbt-runner-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:*'

  # ── INGESTION FUNCTIONS ───────────────────────────────────────────────────

  # LEGACY / DISABLED 2026-10: Google Places key expired; code moved to pipeline/legacy/google-places-enricher/.
  # Replaced by backend/scripts/demo_seed/enrich_facilities_geoapify.py (manual run).
  #   PlacesEnricher:
  #     Type: AWS::Serverless::Function
  #     Properties:
  #       FunctionName: medicoord-places-enricher
  #       CodeUri: ../functions/places-enricher/
  #       Handler: handler.lambda_handler
  #       Role: !GetAtt IngestionRole.Arn
  #       MemorySize: 512
  #       Layers:
  #         - !Ref RequestsLayer
  #       Environment:
  #         Variables:
  #           GOOGLE_PLACES_KEY: '{{resolve:ssm:/medicoord/prod/google_places_key}}'
  #           S3_PREFIX: raw/places/
  #       Events:
  #         Schedule:
  #           Type: Schedule
  #           Properties:
  #             Schedule: rate(7 days)
  #             Name: medicoord-places-enricher-schedule
  #             Enabled: true

  ErWaitScraper:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicoord-er-wait-scraper
      CodeUri: ../functions/er-wait-scraper/
      Handler: handler.lambda_handler
      Role: !GetAtt IngestionRole.Arn
      Layers:
        - !Ref RequestsLayer
      Environment:
        Variables:
          S3_PREFIX: raw/er-wait/
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(7 days)
            Name: medicoord-er-wait-scraper-schedule
            Enabled: false

  OpenDataSync:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicoord-open-data-sync
      CodeUri: ../functions/open-data-sync/
      Handler: handler.lambda_handler
      Role: !GetAtt IngestionRole.Arn
      Layers:
        - !Ref RequestsLayer
      Environment:
        Variables:
          S3_PREFIX: raw/open-data/
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(7 days)
            Name: medicoord-open-data-sync-schedule
            Enabled: false

  # ── PROCESSOR FUNCTIONS ───────────────────────────────────────────────────

  PlacesProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicoord-places-processor
      CodeUri: ../functions/places-processor/
      Handler: handler.lambda_handler
      Role: !GetAtt ProcessorRole.Arn
      Layers:
        - !Ref RequestsLayer

  ErWaitProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicoord-er-wait-processor
      CodeUri: ../functions/er-wait-processor/
      Handler: handler.lambda_handler
      Role: !GetAtt ProcessorRole.Arn

  OpenDataProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicoord-open-data-processor
      CodeUri: ../functions/open-data-processor/
      Handler: handler.lambda_handler
      Role: !GetAtt ProcessorRole.Arn

  # ── NEW: DBT RUNNER FUNCTION ──────────────────────────────────────────────
  # Triggered by ProcessorComplete events from any processor.
  # Runs dbt Core models against Supabase Postgres.
  # Timeout 600s — dbt runs can be slow on cold start with large models.
  # Uses DbtLayer for dbt-core + dbt-postgres + psycopg2.
  DbtRunner:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicoord-dbt-runner
      CodeUri: ../functions/dbt-runner/
      Handler: handler.lambda_handler
      Role: !GetAtt DbtRunnerRole.Arn
      Timeout: 600
      MemorySize: 512
      Layers:
        - !Ref DbtLayer
      Environment:
        Variables:
          DBT_PROJECT_DIR: /var/task/medicoord_dbt
          DBT_PROFILES_DIR: /var/task/medicoord_dbt

  # ── LAMBDA PERMISSIONS ────────────────────────────────────────────────────

  PlacesProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PlacesProcessor.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PlacesProcessorRule.Arn

  ErWaitProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ErWaitProcessor.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ErWaitProcessorRule.Arn

  OpenDataProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OpenDataProcessor.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OpenDataProcessorRule.Arn

  # ── NEW: dbt runner permission ────────────────────────────────────────────
  # Single permission — one rule covers all three processors via
  # source filter 'medicoord.pipeline' + detail-type 'ProcessorComplete'.
  DbtRunnerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DbtRunner.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DbtRunnerRule.Arn

  # ── EVENTBRIDGE RULES ─────────────────────────────────────────────────────

  PlacesProcessorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: medicoord-places-processor-rule
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !ImportValue medicoord-ingestion-bucket-name
          object:
            key:
              - prefix: raw/places/
      State: ENABLED
      Targets:
        - Id: PlacesProcessorTarget
          Arn: !GetAtt PlacesProcessor.Arn

  ErWaitProcessorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: medicoord-er-wait-processor-rule
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !ImportValue medicoord-ingestion-bucket-name
          object:
            key:
              - prefix: raw/er-wait/
      State: ENABLED
      Targets:
        - Id: ErWaitProcessorTarget
          Arn: !GetAtt ErWaitProcessor.Arn

  OpenDataProcessorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: medicoord-open-data-processor-rule
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !ImportValue medicoord-ingestion-bucket-name
          object:
            key:
              - prefix: raw/open-data/
      State: ENABLED
      Targets:
        - Id: OpenDataProcessorTarget
          Arn: !GetAtt OpenDataProcessor.Arn

  # ── NEW: dbt runner rule ──────────────────────────────────────────────────
  # Single rule covering all three processors.
  # Fires when any processor publishes ProcessorComplete with status SUCCESS.
  # Source 'medicoord.pipeline' is a custom source — not aws.s3.
  # This means it only fires on explicit put_events() calls from processors,
  # never on accidental S3 or other AWS events.
  DbtRunnerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: medicoord-dbt-runner-rule
      EventPattern:
        source:
          - medicoord.pipeline
        detail-type:
          - ProcessorComplete
        detail:
          status:
            - SUCCESS
      State: ENABLED
      Targets:
        - Id: DbtRunnerTarget
          Arn: !GetAtt DbtRunner.Arn

# ── OUTPUTS ────────────────────────────────────────────────────────────────
Outputs:

  # LEGACY / DISABLED 2026-10 (see PlacesEnricher above)
  #   PlacesEnricherArn:
  #     Description: Places enricher ingestion function ARN
  #     Value: !GetAtt PlacesEnricher.Arn

  PlacesProcessorArn:
    Description: Places processor function ARN
    Value: !GetAtt PlacesProcessor.Arn

  ErWaitScraperArn:
    Description: ER wait scraper ingestion function ARN
    Value: !GetAtt ErWaitScraper.Arn

  ErWaitProcessorArn:
    Description: ER wait processor function ARN
    Value: !GetAtt ErWaitProcessor.Arn

  OpenDataSyncArn:
    Description: Open data sync ingestion function ARN
    Value: !GetAtt OpenDataSync.Arn

  OpenDataProcessorArn:
    Description: Open data processor function ARN
    Value: !GetAtt OpenDataProcessor.Arn

  # ── NEW ──────────────────────────────────────────────────────────────────
  DbtRunnerArn:
    Description: dbt runner function ARN
    Value: !GetAtt DbtRunner.Arn