name: Eval gate

# Runs only on a PR that carries the `run-eval` label. It makes live calls to Groq (free tier), so it is
# never run on every push. The gate protects the production (no-graph) path: seven cases that were right on
# every recorded baseline run must still be right. It catches gross breaks (a prompt, parser or provider
# change), not subtle drift. Design: CHANGELOG.md, Sprint 23 step 7.

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [preview, main]

concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: Eval gate (sentinel cases, no-graph path)
    if: contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One repeat of each sentinel case. The system is gpt-oss-120b on Groq; the simulated patient is a
      # different Groq model. --min-gap-s keeps the system under Groq's 8,000 tokens-per-minute limit.
      - name: Run the sentinel conversations
        run: |
          python -m scripts.symptom_eval.cli run-ablation \
            --variant lay --providers off --repeats 1 --no-judges --min-gap-s 20 --skip-failed \
            --cases "$(python -c "import json;print(','.join(s['case_id'] for s in json.load(open('scripts/symptom_eval/baselines/off-lay-sentinels.json'))['sentinels']))")" \
            --checkpoint "$RUNNER_TEMP/gate.jsonl"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          EVAL_SIMULATOR_PROVIDER: groq
          EVAL_SIMULATOR_MODEL: qwen/qwen3.8-27b
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply the gate
        run: |
          python -m scripts.symptom_eval.gate \
            --checkpoint "$RUNNER_TEMP/gate.jsonl" \
            --baseline scripts/symptom_eval/baselines/off-lay-sentinels.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Keep the conversations for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-conversations
          path: ${{ runner.temp }}/gate.jsonl
          retention-days: 14
