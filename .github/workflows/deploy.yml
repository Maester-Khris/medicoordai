name: Deploy

on:
  push:
    branches:
      - preview

jobs:
  detect-changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  # Backend deploys to Railway via the Railway CLI from backend/ (see docs/ARCHITECTURE.md).
  # No CI deploy job is wired up yet; add a `railway up` job here if CI-driven deploys are wanted.

  skip-backend:
    name: No backend changes — skip Railway deploy
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'false'

    steps:
      - run: echo "No backend changes — Railway deploy skipped"
