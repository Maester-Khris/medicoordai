# Round-robin over the API replicas. "api" resolves to one address per replica when nginx
# starts, so nginx is restarted after the replica count changes.
worker_processes 1;  # one worker keeps the round-robin order in one place
events { worker_connections 8192; }
http {
  access_log off;
  upstream api {
    server api:8000 max_fails=1 fail_timeout=5s;
    keepalive 64;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 120s;
      # A replica that cannot be reached is skipped; a request it already received is not resent.
      proxy_next_upstream error timeout;
      add_header X-Upstream $upstream_addr always;  # which replica answered, for the checks
    }
  }
}
